<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drop tuner</title>
<style>
  :root {
    --bg: #fafafa;
    --panel: #17181b;
    --panel-fg: #e8e9ec;
    --mute: #9a9ca3;
    --accent: #1794E4;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    grid-template-columns: 1fr 340px;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: #111;
  }
  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; grid-template-rows: 55vh 1fr; }
  }

  /* ---------- stage: mirrors the real deck ---------- */
  .stage {
    position: relative;
    overflow: hidden;
    display: grid;
    place-items: center;
  }
  .deck {
    position: relative;
    width: min(78%, 340px);
    aspect-ratio: 3 / 4;
  }
  .card {
    position: absolute;
    inset: 0;
    background: #fdfdfd;
    border: 1px solid #ececec;
    border-radius: 18px;
    box-shadow: 0 6px 24px rgba(0,0,0,.06);
    transform-origin: 50% 50%;
    will-change: transform;
    padding: 22px;
  }
  .card .meta { font: 600 12px/1 sans-serif; color: #bbb; }
  .card .prompt { font: 600 17px/1.35 sans-serif; margin: 14px 0 0; color: #222; }
  .card .dot {
    position: absolute; right: 18px; bottom: 18px;
    width: 22px; height: 22px; border-radius: 50%; background: #000;
  }

  .floor {
    position: absolute; left: 0; right: 0; bottom: 0; height: 1px;
    background: linear-gradient(90deg, transparent, #ddd 20%, #ddd 80%, transparent);
  }
  .viewportline {
    position: absolute; left: 0; right: 0; top: 0; height: 2px;
    background: repeating-linear-gradient(90deg, #f0a 0 6px, transparent 6px 12px);
    opacity: 0; transition: opacity .2s;
  }
  .stage.showguide .viewportline { opacity: .5; }

  /* ---------- controls ---------- */
  .panel {
    background: var(--panel);
    color: var(--panel-fg);
    padding: 18px 18px 28px;
    overflow-y: auto;
  }
  .panel h1 {
    font: 600 13px/1 sans-serif; letter-spacing: .08em; text-transform: uppercase;
    color: var(--mute); margin: 0 0 16px;
  }
  .mode {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 18px;
  }
  .mode button {
    background: #26282d; color: var(--panel-fg); border: 1px solid #34363c;
    border-radius: 8px; padding: 9px 6px; font: 600 12px/1 sans-serif; cursor: pointer;
  }
  .mode button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  .row { margin-bottom: 13px; }
  .row label {
    display: flex; justify-content: space-between; align-items: baseline;
    font: 500 12px/1.4 sans-serif; color: var(--mute); margin-bottom: 5px;
  }
  .row label b { color: var(--panel-fg); font: 600 12px/1 ui-monospace, Menlo, monospace; }
  .row input[type=range] { width: 100%; accent-color: var(--accent); }
  .row select {
    width: 100%; background: #26282d; color: var(--panel-fg);
    border: 1px solid #34363c; border-radius: 6px; padding: 7px; font: 12px sans-serif;
  }
  .group { border-top: 1px solid #2c2e34; padding-top: 14px; margin-top: 16px; }
  .group[hidden] { display: none; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 18px 0 4px; }
  .actions button {
    padding: 11px 8px; border-radius: 8px; border: 0; cursor: pointer;
    font: 600 13px/1 sans-serif; background: var(--accent); color: #fff;
  }
  .actions button.alt { background: #2c2e34; color: var(--panel-fg); }

  .out {
    margin-top: 14px; width: 100%; min-height: 190px; resize: vertical;
    background: #0f1013; color: #b9d9ef; border: 1px solid #2c2e34; border-radius: 8px;
    padding: 11px; font: 11px/1.5 ui-monospace, Menlo, monospace; white-space: pre;
  }
  .hint { color: var(--mute); font-size: 11px; margin: 10px 0 0; }
  .chk { display: flex; align-items: center; gap: 7px; color: var(--mute); font-size: 12px; margin-top: 12px; }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="viewportline"></div>
  <div class="deck" id="deck"></div>
  <div class="floor"></div>
</div>

<div class="panel">
  <h1>Drop tuner</h1>

  <div class="mode">
    <button id="mCss" aria-pressed="true">CSS keyframes</button>
    <button id="mSpring" aria-pressed="false">Spring (langswipe)</button>
  </div>

  <div class="row">
    <label>Cards <b id="vCards">4</b></label>
    <input type="range" id="cards" min="2" max="6" step="1" value="4">
  </div>
  <div class="row">
    <label>Stagger <b id="vStagger">110ms</b></label>
    <input type="range" id="stagger" min="0" max="260" step="5" value="110">
  </div>
  <div class="row">
    <label>Travel from <b id="vFrom">-70vh</b></label>
    <input type="range" id="from" min="-160" max="-20" step="2" value="-70">
  </div>
  <div class="row">
    <label>Start scale <b id="vScale">1.18</b></label>
    <input type="range" id="scale" min="100" max="180" step="1" value="118">
  </div>
  <div class="row">
    <label>Start tilt <b id="vTilt">6deg</b></label>
    <input type="range" id="tilt" min="0" max="20" step="1" value="6">
  </div>

  <div class="group" id="gCss">
    <div class="row">
      <label>Duration <b id="vDur">850ms</b></label>
      <input type="range" id="dur" min="200" max="2400" step="25" value="850">
    </div>
    <div class="row">
      <label>Fall easing</label>
      <select id="ease">
        <option value=".4,.05,.6,.6">gravity — moderate</option>
        <option value=".55,.09,.68,.53">gravity — strong</option>
        <option value=".64,.04,.78,.35">gravity — heavy (long hang)</option>
        <option value=".25,.1,.25,1">ease (browser default)</option>
        <option value="0,0,1,1">linear</option>
      </select>
    </div>
    <div class="row">
      <label>Overshoot <b id="vOver">12px</b></label>
      <input type="range" id="over" min="0" max="40" step="1" value="12">
    </div>
    <div class="row">
      <label>Rebound <b id="vReb">5px</b></label>
      <input type="range" id="reb" min="0" max="20" step="1" value="5">
    </div>
  </div>

  <div class="group" id="gSpring" hidden>
    <div class="row">
      <label>Tension <b id="vTension">170</b></label>
      <input type="range" id="tension" min="40" max="600" step="5" value="170">
    </div>
    <div class="row">
      <label>Friction <b id="vFriction">26</b></label>
      <input type="range" id="friction" min="6" max="90" step="1" value="26">
    </div>
    <div class="row">
      <label>Mass <b id="vMass">1</b></label>
      <input type="range" id="mass" min="1" max="40" step="1" value="10">
    </div>
    <p class="hint">langswipe's values: tension 170, friction 26, mass 1.
    Spring mode is for feel comparison — it needs JS, so it can't be ported to your CSS as-is.</p>
  </div>

  <div class="actions">
    <button id="replay">Replay</button>
    <button id="loop" class="alt">Loop: off</button>
  </div>

  <label class="chk"><input type="checkbox" id="guide"> show viewport top edge</label>
  <label class="chk"><input type="checkbox" id="slow"> 4× slow motion</label>

  <textarea class="out" id="out" readonly spellcheck="false"></textarea>
  <p class="hint">Paste the block above into <code>src/styles/card.css</code>, and set
  <code>STAGGER</code> in <code>src/js/card.js</code> to the stagger value.</p>
</div>

<script>
const $ = id => document.getElementById(id);
const deck = $('deck'), stage = $('stage');
let mode = 'css', looping = false, loopTimer = null, raf = null;

const P = () => ({
  cards: +$('cards').value,
  stagger: +$('stagger').value,
  from: +$('from').value,
  scale: +$('scale').value / 100,
  tilt: +$('tilt').value,
  dur: +$('dur').value,
  ease: $('ease').value,
  over: +$('over').value,
  reb: +$('reb').value,
  tension: +$('tension').value,
  friction: +$('friction').value,
  mass: +$('mass').value,
  slow: $('slow').checked ? 4 : 1
});

const PROMPTS = [
  'What is the supreme law of the land?',
  'What does the Constitution do?',
  'How many amendments does the Constitution have?',
  'What is one right in the First Amendment?',
  'Who is the Commander in Chief of the military?',
  'How many U.S. Senators are there?'
];

/* Build the stack. Returns [{el, k, ry, rs}] with k=0 as the top card. */
function build(p) {
  deck.innerHTML = '';
  const out = [];
  for (let k = p.cards - 1; k >= 0; k--) {
    const el = document.createElement('article');
    el.className = 'card';
    const ry = k * 7;
    const rs = 1 - k * 0.022;
    el.style.zIndex = String(10 - k);
    el.innerHTML = `<span class="meta">${String(k + 1).padStart(2, '0')}</span>
      <p class="prompt">${PROMPTS[k % PROMPTS.length]}</p><span class="dot"></span>`;
    el.style.transform = `translateY(${ry}px) scale(${rs})`;
    deck.appendChild(el);
    out.push({ el, k, ry, rs });
  }
  return out;
}

/* ---------- CSS keyframes mode ---------- */
function keyframeCss(p) {
  return `@keyframes drop {
  0% {
    transform: translateY(${p.from}vh) rotate(var(--tilt)) scale(calc(var(--rs) * ${p.scale}));
    animation-timing-function: cubic-bezier(${p.ease});
  }
  55% {
    transform: translateY(calc(var(--ry) + ${p.over}px)) rotate(calc(var(--tilt) * .18)) scale(calc(var(--rs) * 1.02));
    animation-timing-function: cubic-bezier(.25, .8, .35, 1);
  }
  76% { transform: translateY(calc(var(--ry) - ${p.reb}px)) rotate(0deg) scale(var(--rs)); }
  100% { transform: translateY(var(--ry)) rotate(0deg) scale(var(--rs)); }
}

.card.drop {
  animation: drop ${p.dur}ms both;
  animation-delay: var(--delay);
}`;
}

let styleTag = document.createElement('style');
document.head.appendChild(styleTag);

function playCss(p) {
  const cards = build(p);
  styleTag.textContent = keyframeCss(p).replace(
    /animation: drop (\d+)ms/, `animation: drop ${p.dur * p.slow}ms`
  );
  const n = p.cards;
  cards.forEach(({ el, k, ry, rs }) => {
    el.style.setProperty('--ry', ry + 'px');
    el.style.setProperty('--rs', String(rs));
    el.style.setProperty('--tilt', `${(k % 2 ? -1 : 1) * (p.tilt + k * 1.5)}deg`);
    el.style.setProperty('--delay', `${(n - 1 - k) * p.stagger * p.slow}ms`);
    el.classList.add('drop');
  });
}

/* ---------- spring mode (react-spring style integrator) ---------- */
function playSpring(p) {
  cancelAnimationFrame(raf);
  const cards = build(p);
  const vh = stage.clientHeight / 100;
  const n = p.cards;

  const sims = cards.map(({ el, k, ry, rs }) => ({
    el,
    delay: (n - 1 - k) * p.stagger * p.slow,
    y: p.from * vh, vy: 0, ty: ry,
    s: rs * p.scale, vs: 0, ts: rs,
    r: (Math.random() * 2 - 1) * p.tilt, vr: 0, tr: 0
  }));

  const dt = 1 / 60 / p.slow;
  let t0 = null;

  function step(ts) {
    if (t0 === null) t0 = ts;
    const elapsed = ts - t0;
    let moving = false;

    for (const s of sims) {
      if (elapsed < s.delay) { moving = true; apply(s); continue; }
      for (const [pos, vel, tgt] of [['y','vy','ty'], ['s','vs','ts'], ['r','vr','tr']]) {
        const a = (-p.tension * (s[pos] - s[tgt]) - p.friction * s[vel]) / p.mass;
        s[vel] += a * dt;
        s[pos] += s[vel] * dt;
      }
      if (Math.abs(s.y - s.ty) > 0.1 || Math.abs(s.vy) > 0.1) moving = true;
      apply(s);
    }
    if (moving) raf = requestAnimationFrame(step);
  }

  function apply(s) {
    s.el.style.transform = `translateY(${s.y}px) rotate(${s.r}deg) scale(${s.s})`;
  }

  sims.forEach(apply);
  raf = requestAnimationFrame(step);
}

/* ---------- wiring ---------- */
function total(p) {
  return mode === 'css'
    ? (p.dur + (p.cards - 1) * p.stagger) * p.slow
    : (1600 + (p.cards - 1) * p.stagger) * p.slow;
}

function play() {
  const p = P();
  syncLabels(p);
  $('out').value = keyframeCss(p) + `\n\n/* src/js/card.js */\nconst STAGGER = ${p.stagger};`;
  mode === 'css' ? playCss(p) : playSpring(p);
  if (looping) {
    clearTimeout(loopTimer);
    loopTimer = setTimeout(play, total(p) + 700);
  }
}

function syncLabels(p) {
  $('vCards').textContent = p.cards;
  $('vStagger').textContent = p.stagger + 'ms';
  $('vFrom').textContent = p.from + 'vh';
  $('vScale').textContent = p.scale.toFixed(2);
  $('vTilt').textContent = p.tilt + 'deg';
  $('vDur').textContent = p.dur + 'ms';
  $('vOver').textContent = p.over + 'px';
  $('vReb').textContent = p.reb + 'px';
  $('vTension').textContent = p.tension;
  $('vFriction').textContent = p.friction;
  $('vMass').textContent = p.mass;
}

document.querySelectorAll('input[type=range], select').forEach(c =>
  c.addEventListener('input', play));

$('replay').onclick = play;
$('guide').onchange = e => stage.classList.toggle('showguide', e.target.checked);
$('slow').onchange = play;

$('loop').onclick = () => {
  looping = !looping;
  $('loop').textContent = 'Loop: ' + (looping ? 'on' : 'off');
  clearTimeout(loopTimer);
  if (looping) play();
};

function setMode(m) {
  mode = m;
  $('mCss').setAttribute('aria-pressed', String(m === 'css'));
  $('mSpring').setAttribute('aria-pressed', String(m === 'spring'));
  $('gCss').hidden = m !== 'css';
  $('gSpring').hidden = m !== 'spring';
  play();
}
$('mCss').onclick = () => setMode('css');
$('mSpring').onclick = () => setMode('spring');

play();
</script>
</body>
</html>
