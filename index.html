<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="US citizenship civics test — 2025 version, 128 questions.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/public/twitter.svg">
  <link rel="icon" type="image/svg+xml" href="/public/twitter.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>Civics 128</title>
</head>
<body>

  <main class="stage">
    <div class="deck" id="deck" aria-live="polite"></div>
    <p class="empty" id="empty" hidden></p>
  </main>

  <div class="bar">
    <button class="burger" id="openMenu" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
  </div>

  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Menu" hidden>
    <div class="sheet-inner">

      <div class="stat">
        <div><b id="sKnown">0</b><span>Known</span></div>
        <div><b id="sMissed">0</b><span>Missed</span></div>
        <div><b id="sUnseen">0</b><span>Unseen</span></div>
      </div>

      <p class="lbl">Study</p>
      <div class="seg" id="modes" role="group" aria-label="Study mode">
        <button data-mode="all" aria-pressed="true">All</button>
        <button data-mode="missed" aria-pressed="false">Missed</button>
        <button data-mode="unseen" aria-pressed="false">Unseen</button>
      </div>

      <p class="lbl">Sections</p>
      <ul class="list" id="sections"></ul>

      <p class="lbl">Text size</p>
      <div class="ctl">
        <input id="scale" type="range" min="80" max="150" step="5" value="130" aria-label="Text size">
        <span class="val" id="scaleOut">130%</span>
      </div>

      <div class="actions">
        <button class="ghost" id="shuffle">Shuffle deck</button>
        <button class="ghost" id="reset">Reset progress</button>
      </div>

      <p class="foot">USCIS M-1778 (09/25) · 2025 civics test</p>
    </div>

    <div class="closebar">
      <button class="close" id="closeMenu" aria-label="Close menu">&#10005;</button>
    </div>
  </div>

  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
